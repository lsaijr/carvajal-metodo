<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Centro Carvajal · Catálogo de Tratamientos</title>
<style>
:root{
  --dark:#1a1410;--olive:#8fa832;--olive-light:rgba(143,168,50,.1);
  --gold:#b8935a;--cream:#f4f5ef;--white:#fff;--gray:#6b7280;
  --border:rgba(143,168,50,.2);--red:#dc2626;--red-light:#fef2f2;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--cream);color:var(--dark);min-height:100vh}

/* LOGIN */
#login-screen{
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;padding:20px;
}
.login-box{
  background:var(--white);border-radius:12px;padding:44px 40px;
  max-width:400px;width:100%;box-shadow:0 8px 40px rgba(0,0,0,.1);
  text-align:center;
}
.login-logo{margin:0 auto 20px}
.login-box h2{font-size:22px;font-weight:600;color:var(--dark);margin-bottom:6px}
.login-box p{font-size:13px;color:var(--gray);margin-bottom:28px}
.login-field{
  width:100%;padding:13px 16px;border:1px solid #d4dcc0;
  border-radius:8px;font-size:14px;margin-bottom:14px;
  font-family:inherit;outline:none;transition:border-color .2s;
}
.login-field:focus{border-color:var(--olive)}
.login-btn{
  width:100%;padding:14px;background:var(--dark);color:var(--cream);
  border:none;border-radius:8px;font-size:14px;font-weight:500;
  cursor:pointer;font-family:inherit;transition:background .2s;
}
.login-btn:hover{background:#2d3a2e}
.login-error{
  display:none;background:#fef2f2;border:1px solid #fecaca;
  border-radius:6px;padding:10px 14px;font-size:13px;color:var(--red);
  margin-bottom:14px;text-align:left;
}

/* APP */
#app{display:none;min-height:100vh;flex-direction:column}
.topbar{
  background:var(--dark);padding:14px 28px;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:100;
}
.topbar-left{display:flex;align-items:center;gap:14px}
.topbar-logo{
  width:36px;height:36px;border-radius:50%;
  border:1.5px solid var(--gold);
  display:flex;align-items:center;justify-content:center;
  font-family:Georgia,serif;font-size:12px;color:var(--gold);font-weight:600;
}
.topbar-title{font-size:15px;font-weight:600;color:var(--white)}
.topbar-sub{font-size:11px;color:rgba(255,255,255,.35);margin-top:1px}
.topbar-right{display:flex;align-items:center;gap:12px}
.topbar-count{
  background:var(--olive-light);border:1px solid var(--border);
  border-radius:20px;padding:4px 12px;
  font-size:12px;font-weight:600;color:var(--olive);
}
.logout-btn{
  background:transparent;border:1px solid rgba(255,255,255,.15);
  color:rgba(255,255,255,.5);border-radius:6px;padding:6px 12px;
  font-size:12px;cursor:pointer;font-family:inherit;transition:all .2s;
}
.logout-btn:hover{border-color:rgba(255,255,255,.4);color:var(--white)}

.main{flex:1;padding:28px;max-width:1200px;margin:0 auto;width:100%}

.toolbar{
  display:flex;align-items:center;gap:12px;margin-bottom:24px;flex-wrap:wrap;
}
.search-wrap{position:relative;flex:1;min-width:220px}
.search-input{
  width:100%;padding:10px 16px 10px 38px;
  border:1px solid #d4dcc0;border-radius:8px;font-size:13px;
  font-family:inherit;outline:none;background:var(--white);
  transition:border-color .2s;
}
.search-input:focus{border-color:var(--olive)}
.search-icon{
  position:absolute;left:12px;top:50%;transform:translateY(-50%);
  color:var(--gray);font-size:15px;pointer-events:none;
}
.btn{
  padding:10px 16px;background:var(--white);border:1px solid #d4dcc0;
  border-radius:8px;font-size:13px;cursor:pointer;font-family:inherit;
  color:var(--dark);transition:all .2s;display:flex;align-items:center;gap:6px;
}
.btn:hover{border-color:var(--olive);color:var(--olive)}
.btn-primary{background:var(--dark);color:var(--white);border-color:var(--dark)}
.btn-primary:hover{background:#2d3a2e;color:var(--white)}
.btn-success{background:var(--olive);color:var(--white);border-color:var(--olive)}
.btn-success:hover{background:#7a9428}
.btn-danger{background:var(--red);color:var(--white);border-color:var(--red)}
.btn-danger:hover{background:#b91c1c}

/* Cards */
.catalogo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:16px}
.treatment-card{
  background:var(--white);border:1px solid rgba(0,0,0,.07);
  border-radius:10px;overflow:hidden;transition:box-shadow .2s,opacity .2s;
}
.treatment-card:hover{box-shadow:0 4px 20px rgba(0,0,0,.1)}
.treatment-card.inactive{opacity:.55}
.card-header{
  background:var(--dark);padding:14px 18px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.card-header-title{
  font-size:15px;font-weight:600;color:var(--white);line-height:1.3;flex:1;
}
.card-header-title input{
  width:100%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);
  border-radius:4px;padding:6px 10px;color:var(--white);font-size:14px;
}
.toggle{
  width:44px;height:24px;background:rgba(255,255,255,.2);border-radius:12px;
  position:relative;cursor:pointer;transition:background .2s;flex-shrink:0;
}
.toggle.active{background:var(--olive)}
.toggle::after{
  content:'';position:absolute;width:20px;height:20px;background:var(--white);
  border-radius:50%;top:2px;left:2px;transition:left .2s;
}
.toggle.active::after{left:22px}

.card-body{padding:18px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.field-row.three{grid-template-columns:repeat(3,1fr)}
.field-group{display:flex;flex-direction:column;gap:4px}
.field-group.full{grid-column:1/-1}
.field-label{font-size:11px;color:var(--gray);text-transform:uppercase;letter-spacing:.6px;font-weight:600}
.field-input{
  padding:8px 10px;border:1px solid #d4dcc0;border-radius:6px;
  font-size:13px;font-family:inherit;outline:none;background:var(--white);
}
.field-input:focus{border-color:var(--olive)}
textarea.field-input{min-height:60px;resize:vertical}

.chips-list{display:flex;flex-wrap:wrap;gap:6px;padding:6px;border:1px solid #d4dcc0;border-radius:6px;background:var(--white);min-height:38px}
.chip{
  display:inline-flex;align-items:center;gap:4px;
  background:var(--olive-light);border:1px solid var(--border);
  border-radius:14px;padding:4px 10px;font-size:12px;color:var(--dark);
}
.chip button{
  background:none;border:none;color:var(--gray);cursor:pointer;font-size:14px;line-height:1;
}
.chip button:hover{color:var(--red)}
.chip-input{
  border:none;background:transparent;outline:none;font-size:13px;
  min-width:120px;padding:4px 2px;flex:1;
}

.precios-list{display:flex;flex-direction:column;gap:6px}
.precio-row{display:flex;gap:8px;align-items:center}
.precio-row input{flex:1;padding:8px 10px;border:1px solid #d4dcc0;border-radius:6px;font-size:13px}
.precio-row input.valor{flex:0 0 100px}
.precio-row button{
  background:none;border:none;color:var(--red);cursor:pointer;font-size:16px;
}
.add-precio{
  font-size:12px;color:var(--olive);cursor:pointer;background:none;border:none;
  padding:4px 0;display:flex;align-items:center;gap:4px;
}
.add-precio:hover{color:#5a7a1a}

.card-footer{
  padding:12px 18px;border-top:1px solid rgba(0,0,0,.05);
  display:flex;justify-content:space-between;align-items:center;
}
.last-update{font-size:11px;color:var(--gray)}

.empty-state{
  text-align:center;padding:80px 20px;color:var(--gray);grid-column:1/-1;
}
.empty-state .icon{font-size:48px;margin-bottom:16px}
.empty-state h3{font-size:18px;color:var(--dark);margin-bottom:8px}

/* Toast */
.toast{
  position:fixed;bottom:24px;right:24px;
  background:var(--dark);color:var(--white);
  padding:12px 20px;border-radius:8px;font-size:13px;
  box-shadow:0 4px 20px rgba(0,0,0,.2);
  transform:translateY(100px);opacity:0;
  transition:all .3s;z-index:999;
  display:flex;align-items:center;gap:8px;
}
.toast.show{transform:translateY(0);opacity:1}
.toast.success{border-left:3px solid var(--olive)}
.toast.error{border-left:3px solid var(--red)}

.saving-overlay{
  position:fixed;inset:0;background:rgba(255,255,255,.7);
  display:none;align-items:center;justify-content:center;z-index:1000;
}
.saving-overlay.show{display:flex}
.spinner{
  width:40px;height:40px;border:3px solid var(--border);
  border-top-color:var(--olive);border-radius:50%;
  animation:spin 1s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

@media (max-width:720px){
  .field-row,.field-row.three{grid-template-columns:1fr}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <svg class="login-logo" width="48" height="48" viewBox="0 0 48 48" fill="none">
      <circle cx="24" cy="24" r="22" stroke="#b8935a" stroke-width="1.5"/>
      <text x="24" y="29" text-anchor="middle" fill="#b8935a" font-family="Georgia,serif" font-size="14" font-weight="600">CC</text>
    </svg>
    <h2>Centro Carvajal</h2>
    <p>Catálogo de tratamientos · Alimentación de la IA</p>
    <div class="login-error" id="login-error">Credenciales incorrectas. Inténtalo de nuevo.</div>
    <input type="email" class="login-field" id="login-email" placeholder="Correo electrónico" onkeydown="if(event.key==='Enter')document.getElementById('login-pass').focus()">
    <input type="password" class="login-field" id="login-pass" placeholder="Contraseña" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="login-btn" onclick="doLogin()">Ingresar</button>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="topbar">
    <div class="topbar-left">
      <div class="topbar-logo">CC</div>
      <div>
        <div class="topbar-title">Catálogo de Tratamientos</div>
        <div class="topbar-sub">Centro Carvajal · Fuente de datos para la IA</div>
      </div>
    </div>
    <div class="topbar-right">
      <div class="topbar-count" id="activos-count">— activos</div>
      <button class="logout-btn" onclick="doLogout()">Cerrar sesión</button>
    </div>
  </div>

  <div class="main">
    <div class="toolbar">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" class="search-input" id="search-input" placeholder="Buscar tratamiento..." oninput="filtrarCatalogo()">
      </div>
      <button class="btn btn-success" onclick="agregarTratamiento()">
        + Nuevo tratamiento
      </button>
      <button class="btn btn-primary" onclick="guardarCatalogo()">
        💾 Guardar cambios
      </button>
      <button class="btn" onclick="descargarJSON()">
        ⬇ JSON
      </button>
    </div>

    <div class="catalogo-grid" id="catalogo-grid">
      <div class="empty-state">
        <div class="icon">📋</div>
        <h3>Cargando catálogo...</h3>
      </div>
    </div>
  </div>
</div>

<div class="saving-overlay" id="saving-overlay">
  <div class="spinner"></div>
</div>
<div class="toast" id="toast"></div>

<script>
let token = sessionStorage.getItem('cc_token') || '';
let catalogo = {tratamientos:[]};
let usuario = null;

async function doLogin(){
  const email = document.getElementById('login-email').value.trim();
  const pass  = document.getElementById('login-pass').value;
  const err   = document.getElementById('login-error');
  err.style.display = 'none';
  if(!email || !pass){err.style.display='block';return;}
  try{
    const r = await fetch('/api/login',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({email,password:pass})
    });
    const d = await r.json();
    if(d.ok){
      token = d.token;
      usuario = {email,rol:d.rol};
      sessionStorage.setItem('cc_token',token);
      document.getElementById('login-screen').style.display='none';
      document.getElementById('app').style.display='flex';
      cargarCatalogo();
    } else {
      err.style.display='block';
      err.textContent = d.error || 'Credenciales incorrectas';
    }
  } catch(e){
    err.style.display='block';err.textContent='Error de conexión';
  }
}

function doLogout(){
  token='';usuario=null;
  sessionStorage.removeItem('cc_token');
  document.getElementById('app').style.display='none';
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('login-pass').value='';
}

if(token){
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app').style.display='flex';
  cargarCatalogo();
}

async function cargarCatalogo(){
  try{
    const r = await fetch('/api/catalogo',{headers:{'X-Token':token}});
    if(r.status===401){doLogout();return;}
    catalogo = await r.json();
    filtrarCatalogo();
  } catch(e){
    mostrarToast('Error al cargar catálogo','error');
  }
}

function filtrarCatalogo(){
  const q = document.getElementById('search-input').value.toLowerCase();
  const lista = catalogo.tratamientos.filter(t => !q || t.nombre.toLowerCase().includes(q));
  document.getElementById('activos-count').textContent =
    `${catalogo.tratamientos.filter(t=>t.activo).length} de ${catalogo.tratamientos.length} activos`;
  renderCatalogo(lista);
}

function renderCatalogo(lista){
  const grid = document.getElementById('catalogo-grid');
  if(!lista.length){
    grid.innerHTML = `<div class="empty-state"><div class="icon">🔍</div><h3>No hay tratamientos</h3><p>No se encontraron tratamientos con ese criterio.</p></div>`;
    return;
  }
  grid.innerHTML = lista.map((t,idx) => cardHTML(t,idx)).join('');
}

function cardHTML(t,idx){
  const realIdx = catalogo.tratamientos.indexOf(t);
  return `<div class="treatment-card ${t.activo?'':'inactive'}" data-idx="${realIdx}">
    <div class="card-header">
      <div class="field-group full" style="margin:0">
        <input class="card-header-title" value="${esc(t.nombre)}" onchange="actualizarCampo(${realIdx},'nombre',this.value)">
      </div>
      <div class="toggle ${t.activo?'active':''}" onclick="toggleActivo(${realIdx})" title="${t.activo?'Activo':'Inactivo'}"></div>
    </div>
    <div class="card-body">
      <div class="field-row">
        <div class="field-group">
          <label class="field-label">Categoría</label>
          <input class="field-input" value="${esc(t.categoria||'')}" onchange="actualizarCampo(${realIdx},'categoria',this.value)">
        </div>
        <div class="field-group">
          <label class="field-label">Ticket</label>
          <input class="field-input" value="${esc(t.ticket||'')}" onchange="actualizarCampo(${realIdx},'ticket',this.value)">
        </div>
      </div>
      <div class="field-row three">
        <div class="field-group">
          <label class="field-label">Sesiones</label>
          <input class="field-input" value="${esc(t.sesiones||'')}" onchange="actualizarCampo(${realIdx},'sesiones',this.value)">
        </div>
        <div class="field-group">
          <label class="field-label">Intervalo</label>
          <input class="field-input" value="${esc(t.intervalo||'')}" onchange="actualizarCampo(${realIdx},'intervalo',this.value)">
        </div>
        <div class="field-group">
          <label class="field-label">Recovery</label>
          <input class="field-input" value="${esc(t.recovery||'')}" onchange="actualizarCampo(${realIdx},'recovery',this.value)">
        </div>
      </div>
      <div class="field-group full">
        <label class="field-label">Orden / Protocolo</label>
        <input class="field-input" value="${esc(t.orden||'')}" onchange="actualizarCampo(${realIdx},'orden',this.value)">
      </div>
      <div class="field-group full" style="margin-top:12px">
        <label class="field-label">Precios</label>
        <div class="precios-list" id="precios-${realIdx}">
          ${(t.precios||[]).map((p,pidx)=>precioHTML(realIdx,pidx,p)).join('')}
        </div>
        <button class="add-precio" onclick="agregarPrecio(${realIdx})">+ Agregar precio</button>
      </div>
      ${chipsGroup(realIdx,'problemas','Problemas que resuelve',t.problemas)}
      ${chipsGroup(realIdx,'zonas','Zonas aplicables',t.zonas)}
      ${chipsGroup(realIdx,'grado','Grado',t.grado)}
      ${chipsGroup(realIdx,'combinar_con','Combinar con',t.combinar_con)}
      ${chipsGroup(realIdx,'no_combinar','NO combinar con',t.no_combinar)}
      ${chipsGroup(realIdx,'contraindicaciones','Contraindicaciones',t.contraindicaciones)}
      <div class="field-group full" style="margin-top:12px">
        <label class="field-label">Notas médicas</label>
        <textarea class="field-input" onchange="actualizarCampo(${realIdx},'notas_medicas',this.value)">${esc(t.notas_medicas||'')}</textarea>
      </div>
    </div>
    <div class="card-footer">
      <span class="last-update">Índice ${realIdx+1} · ${t.activo?'Activo':'Inactivo'}</span>
      <button class="btn btn-danger" style="padding:6px 12px;font-size:12px" onclick="eliminarTratamiento(${realIdx})">Eliminar</button>
    </div>
  </div>`;
}

function precioHTML(tidx,pidx,p){
  return `<div class="precio-row">
    <input placeholder="Nombre paquete" value="${esc(p.nombre||'')}" onchange="actualizarPrecio(${tidx},${pidx},'nombre',this.value)">
    <input class="valor" type="number" placeholder="$" value="${p.valor!==null&&p.valor!==undefined?p.valor:''}" onchange="actualizarPrecio(${tidx},${pidx},'valor',this.value)">
    <button onclick="eliminarPrecio(${tidx},${pidx})">×</button>
  </div>`;
}

function chipsGroup(tidx,key,label,items){
  const list = (items||[]).map((x,i)=>`<span class="chip">${esc(x)} <button onclick="eliminarChip(${tidx},'${key}',${i})">×</button></span>`).join('');
  return `<div class="field-group full" style="margin-top:12px">
    <label class="field-label">${label}</label>
    <div class="chips-list" onclick="focusChipInput(this)">
      ${list}
      <input class="chip-input" placeholder="Escribir y Enter..." onkeydown="if(event.key==='Enter'){agregarChip(${tidx},'${key}',this);event.preventDefault()}">
    </div>
  </div>`;
}

function focusChipInput(el){el.querySelector('.chip-input').focus()}

function actualizarCampo(idx,campo,valor){
  catalogo.tratamientos[idx][campo] = valor;
}

function toggleActivo(idx){
  catalogo.tratamientos[idx].activo = !catalogo.tratamientos[idx].activo;
  filtrarCatalogo();
}

function agregarPrecio(idx){
  catalogo.tratamientos[idx].precios = catalogo.tratamientos[idx].precios || [];
  catalogo.tratamientos[idx].precios.push({nombre:'',valor:null});
  filtrarCatalogo();
}

function actualizarPrecio(tidx,pidx,campo,valor){
  catalogo.tratamientos[tidx].precios[pidx][campo] = campo==='valor' ? (valor===''?null:parseInt(valor)) : valor;
}

function eliminarPrecio(tidx,pidx){
  catalogo.tratamientos[tidx].precios.splice(pidx,1);
  filtrarCatalogo();
}

function agregarChip(idx,key,input){
  const val = input.value.trim();
  if(!val) return;
  catalogo.tratamientos[idx][key] = catalogo.tratamientos[idx][key] || [];
  catalogo.tratamientos[idx][key].push(val);
  input.value='';
  filtrarCatalogo();
}

function eliminarChip(idx,key,i){
  catalogo.tratamientos[idx][key].splice(i,1);
  filtrarCatalogo();
}

function agregarTratamiento(){
  catalogo.tratamientos.push({
    nombre:'Nuevo tratamiento',
    categoria:'',ticket:'',activo:true,
    precios:[],problemas:[],zonas:[],grado:[],
    sesiones:'',intervalo:'',recovery:'',
    combinar_con:[],no_combinar:[],orden:'',
    contraindicaciones:[],notas_medicas:''
  });
  filtrarCatalogo();
  const grid = document.getElementById('catalogo-grid');
  setTimeout(()=>grid.lastElementChild.scrollIntoView({behavior:'smooth'}),50);
}

function eliminarTratamiento(idx){
  if(!confirm('¿Eliminar este tratamiento del catálogo?')) return;
  catalogo.tratamientos.splice(idx,1);
  filtrarCatalogo();
}

async function guardarCatalogo(){
  document.getElementById('saving-overlay').classList.add('show');
  try{
    catalogo.ultima_actualizacion = new Date().toISOString();
    const r = await fetch('/api/catalogo',{
      method:'POST',
      headers:{'Content-Type':'application/json','X-Token':token},
      body:JSON.stringify(catalogo)
    });
    if(r.status===401){doLogout();return;}
    const d = await r.json();
    if(d.ok){
      mostrarToast('Catálogo guardado correctamente','success');
    } else {
      mostrarToast(d.error||'Error al guardar','error');
    }
  } catch(e){
    mostrarToast('Error de conexión al guardar','error');
  } finally {
    document.getElementById('saving-overlay').classList.remove('show');
  }
}

function descargarJSON(){
  const blob = new Blob([JSON.stringify(catalogo,null,2)],{type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'catalogo_tratamientos.json';
  a.click();
  URL.revokeObjectURL(url);
}

function esc(s){
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function mostrarToast(msg,tipo='success'){
  const t = document.getElementById('toast');
  t.textContent = (tipo==='success'?'✓ ':'✕ ') + msg;
  t.className = `toast ${tipo} show`;
  setTimeout(()=>t.classList.remove('show'),3000);
}
</script>
</body>
</html>

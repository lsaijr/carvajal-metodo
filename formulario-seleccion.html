<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Revisión de Campos — Formulario Método Carvajal</title>
<style>
:root{
  --cream:#f6f1e9; --warm-white:#fffdf9; --dark:#1a1410; --gold:#b8935a; --gold-light:#e8d4a8;
  --border:#e2d8c8; --muted:#8a7a68; --green:#3f8f4f; --green-bg:#eaf6ec; --red:#c0392b; --red-bg:#fbeceb;
}
*{box-sizing:border-box; margin:0; padding:0}
body{
  font-family:'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  background:var(--cream); color:var(--dark); line-height:1.4; padding-bottom:24px;
}
header{
  background:var(--dark); color:var(--warm-white); padding:20px 16px 16px;
  position:sticky; top:0; z-index:20; box-shadow:0 2px 10px rgba(0,0,0,.15);
}
header h1{font-size:18px; font-weight:600; color:var(--gold-light)}
header p{font-size:12px; color:rgba(255,255,255,.5); margin-top:2px}
.summary-bar{
  display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;
}
.summary-pill{
  font-size:11px; padding:5px 10px; border-radius:20px; font-weight:600;
  display:flex; align-items:center; gap:5px;
}
.pill-keep{background:rgba(63,143,79,.2); color:#8fd99c}
.pill-remove{background:rgba(192,57,43,.2); color:#e8938a}
.pill-pending{background:rgba(255,255,255,.1); color:rgba(255,255,255,.6)}

.step-nav{
  display:flex; gap:6px; overflow-x:auto; padding:12px 16px; background:var(--warm-white);
  border-bottom:1px solid var(--border); position:sticky; top:96px; z-index:19;
  -webkit-overflow-scrolling:touch;
}
.step-nav::-webkit-scrollbar{display:none}
.step-btn{
  flex-shrink:0; font-size:12px; padding:8px 14px; border-radius:20px; border:1.5px solid var(--border);
  background:var(--warm-white); color:var(--muted); font-weight:500; white-space:nowrap; cursor:pointer;
}
.step-btn.active{background:var(--dark); border-color:var(--dark); color:var(--gold-light)}
.step-btn .badge{font-size:10px; opacity:.7; margin-left:4px}

main{max-width:720px; margin:0 auto; padding:20px 14px}

.step-panel{display:none}
.step-panel.active{display:block; animation:fade .25s ease}
@keyframes fade{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:translateY(0)}}

.step-title{font-size:22px; font-weight:600; margin-bottom:2px}
.step-subtitle{font-size:13px; color:var(--muted); margin-bottom:18px}
.sub-label{
  font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--gold);
  font-weight:700; margin:20px 0 8px; padding-top:8px; border-top:1px dashed var(--border);
}
.sub-label:first-of-type{border-top:none; margin-top:0}

.field-card{
  background:var(--warm-white); border:2px solid var(--border); border-radius:10px;
  padding:14px 14px 12px; margin-bottom:10px; transition:border-color .15s ease, background .15s ease;
}
.field-card.mantener{border-color:var(--green); background:var(--green-bg)}
.field-card.quitar{border-color:var(--red); background:var(--red-bg)}

.field-label{font-size:14.5px; font-weight:600; color:var(--dark); margin-bottom:3px}
.field-card.quitar .field-label{text-decoration:line-through; color:var(--muted)}
.field-req{color:var(--red); font-weight:700; margin-left:2px}
.field-meta{font-size:11.5px; color:var(--muted); margin-bottom:10px; line-height:1.5}
.field-meta .opt{
  display:inline-block; background:rgba(0,0,0,.04); border-radius:4px; padding:1px 6px; margin:2px 3px 0 0;
}
.decision-row{display:flex; gap:10px; margin-top:8px}
.dbtn{
  flex:1; font-size:16px; font-weight:700; padding:16px 10px; border-radius:12px; border:2px solid var(--border);
  background:var(--warm-white); color:var(--muted); cursor:pointer; text-align:center;
  display:flex; align-items:center; justify-content:center; gap:7px;
}
.dbtn-keep.on{background:var(--green); border-color:var(--green); color:#fff; box-shadow:0 2px 8px rgba(63,143,79,.35)}
.dbtn-remove.on{background:var(--red); border-color:var(--red); color:#fff; box-shadow:0 2px 8px rgba(192,57,43,.35)}
.dbtn:active{transform:scale(.96)}

.step-footer{
  display:flex; justify-content:space-between; align-items:center; margin-top:24px; padding-top:16px;
}
.nav-btn{
  font-size:13px; font-weight:600; padding:11px 18px; border-radius:8px; border:1.5px solid var(--dark);
  background:var(--dark); color:var(--warm-white); cursor:pointer;
}
.nav-btn.ghost{background:transparent; color:var(--dark)}
.nav-btn:disabled{opacity:.35; cursor:default}

.nav-btn-send{
  background:var(--gold); border-color:var(--gold); box-shadow:0 3px 10px rgba(184,147,90,.4);
}
.nav-btn-send:disabled{opacity:.6}

.toast{
  position:fixed; bottom:80px; left:50%; transform:translateX(-50%) translateY(20px);
  background:var(--dark); color:#fff; font-size:13px; padding:11px 20px; border-radius:8px;
  opacity:0; pointer-events:none; transition:all .3s ease; z-index:50; max-width:90%; text-align:center;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0)}

@media(min-width:640px){
  .field-card{padding:18px 20px 16px}
  .decision-row{max-width:280px}
}
</style>
</head>
<body>

<header>

    <div class="summary-pill pill-pending">○ <span id="cnt-pending">0</span> sin marcar</div>
  </div>
</header>

<nav class="step-nav" id="step-nav"></nav>

<main id="main"></main>

<div class="toast" id="toast"></div>

  {sub:"Actividad Física"},
  {label:"Nivel de actividad física", tipo:"opción única", opciones:["Sedentario","Ligero (1–2/sem)","Moderado (3–4/sem)","Intenso (5+/sem)"], req:true},
  {sub:"Antecedentes Familiares y Contraindicaciones"},
  {label:"¿En su familia hay historia de alguna enfermedad relevante?", tipo:"sí/no", req:true},
  {label:"¿Tienes alergias a medicamentos o productos tópicos?", tipo:"sí/no", req:true},
  {label:"¿Has tenido infecciones cutáneas en zonas a tratar?", tipo:"sí/no", req:true},
  {label:"¿Tienes marcapasos, implantes metálicos o dispositivos médicos?", tipo:"sí/no", req:true},
  {sub:"Antecedentes Familiares"},
  {label:"¿Algún familiar directo con enfermedades relevantes?", tipo:"opción única + detalle", opciones:["Sí","No"]},
  {id:"f-antecedentes-det", label:"¿Cuáles? (diabetes, cáncer, cardíacas, etc.)", tipo:"texto largo"},
]},
{titulo:"Declaración y Consentimiento", subtitulo:"Para finalizar, confirma los siguientes puntos marcando cada uno.", campos:[
  {label:"Declaro que la información es verídica y completa", tipo:"checkbox consentimiento", req:true},
  {label:"Comprendo el riesgo de ocultar información médica", tipo:"checkbox consentimiento", req:true},
  {label:"Me comprometo a informar cambios en mi estado de salud", tipo:"checkbox consentimiento", req:true},
  {label:"Entiendo que los resultados pueden variar según cada paciente", tipo:"checkbox consentimiento", req:true},
  {label:"Autorizo a la clínica a contactarme para seguimiento", tipo:"checkbox consentimiento", req:true},
  {id:"fecha-envio", label:"Fecha de envío", tipo:"fecha", req:true},
]},
];

// ── Asignar índice único a cada campo (para persistencia) ──
let uid = 0;
STEPS.forEach((step, si) => {
  step.campos.forEach(c => {
    if (!c.sub) { c.uid = 'c' + (uid++); c.stepIndex = si; }
  });
});

const STORAGE_KEY = 'carvajal_revision_formulario_v1';
let decisiones = {};
try { decisiones = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch(e) { decisiones = {}; }

let currentStep = 0;

function guardar(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(decisiones)); }

function setDecision(uidVal, valor){
  if (decisiones[uidVal] === valor) delete decisiones[uidVal];
  else decisiones[uidVal] = valor;
  guardar();
  renderStep(currentStep);
  updateCounters();
}

function updateCounters(){
  let keep=0, remove=0;
  Object.values(decisiones).forEach(v => { if (v==='mantener') keep++; else if (v==='quitar') remove++; });
  document.getElementById('cnt-keep').textContent = keep;
  document.getElementById('cnt-remove').textContent = remove;
  document.getElementById('cnt-pending').textContent = uid - keep - remove;
}

function renderNav(){
  const nav = document.getElementById('step-nav');
  nav.innerHTML = STEPS.map((s,i) => `<button class="step-btn${i===currentStep?' active':''}" onclick="goStep(${i})">${i+1}. ${s.titulo}</button>`).join('');
}

function fieldMetaHtml(c){
  let parts = [c.tipo];
  let html = `<div class="field-meta">${parts.join(' · ')}`;
  if (c.opciones) {
    html += '<div style="margin-top:5px">' + c.opciones.map(o=>`<span class="opt">${o}</span>`).join('') + '</div>';
  }
  html += '</div>';
  return html;
}

function renderStep(i){
  currentStep = i;
  renderNav();
  const step = STEPS[i];
  const main = document.getElementById('main');
  let html = `<div class="step-panel active"><div class="step-title">${step.titulo}</div><div class="step-subtitle">${step.subtitulo}</div>`;
  step.campos.forEach(c => {
    if (c.sub) { html += `<div class="sub-label">${c.sub}</div>`; return; }
    const dec = decisiones[c.uid];
    const cardClass = dec === 'mantener' ? 'mantener' : dec === 'quitar' ? 'quitar' : '';
    html += `<div class="field-card ${cardClass}">
      <div class="field-label">${c.label}${c.req ? '<span class="field-req">*</span>' : ''}</div>
      ${fieldMetaHtml(c)}
      <div class="decision-row">
        <button class="dbtn dbtn-keep${dec==='mantener'?' on':''}" onclick="setDecision('${c.uid}','mantener')">✓ Mantener</button>
        <button class="dbtn dbtn-remove${dec==='quitar'?' on':''}" onclick="setDecision('${c.uid}','quitar')">✕ Quitar</button>
      </div>
    </div>`;
  });
  const esUltimoPaso = i === STEPS.length - 1;
  html += `<div class="step-footer">
    <button class="nav-btn ghost" onclick="goStep(${i-1})" ${i===0?'disabled':''}>← Anterior</button>
    ${esUltimoPaso
      ? `<button class="nav-btn nav-btn-send" onclick="enviarCorreo()">✉ Enviar formulario</button>`
      : `<button class="nav-btn" onclick="goStep(${i+1})">Siguiente →</button>`}
  </div></div>`;
  main.innerHTML = html;
  window.scrollTo({top:0, behavior:'instant'});
}

function pasoCompleto(i){
  return STEPS[i].campos.every(c => c.sub || decisiones[c.uid]);
}

function goStep(i){
  if (i < 0 || i >= STEPS.length) return;
  if (i > currentStep && !pasoCompleto(currentStep)) {
    const faltan = STEPS[currentStep].campos.filter(c => !c.sub && !decisiones[c.uid]).length;
    showToast(`Falta marcar ${faltan} campo(s) de este paso antes de continuar`, 3000);
    return;
  }
  renderStep(i);
}

function showToast(msg, dur=2600){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), dur);
}

function buildResultados(){
  const resultados = [];
  STEPS.forEach(step => {
    step.campos.forEach(c => {
      if (c.sub) return;
      resultados.push({
        paso: step.titulo,
        campo: c.label,
        id: c.id || '',
        decision: decisiones[c.uid] || 'sin_marcar',
      });
    });
  });
  return resultados;
}

async function enviarCorreo(){
  const data = buildResultados();
  const pendientes = data.filter(r => r.decision === 'sin_marcar').length;
  if (pendientes > 0) {
    const pasoFaltante = STEPS.findIndex((s, idx) => !pasoCompleto(idx));
    showToast(`Todavía faltan ${pendientes} campos por marcar`, 3000);
    if (pasoFaltante >= 0) goStep(pasoFaltante);
    return;
  }
  const btn = event.target;
  const originalText = btn.textContent;
  btn.disabled = true; btn.textContent = '⏳ Enviando...';
  try {
    const resp = await fetch('/api/formulario-seleccion/enviar', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({campos: data})
    });
    const result = await resp.json();
    if (result.ok) showToast('✓ Correo enviado a isai.josue@gmail.com');
    else showToast('Error: ' + (result.error || '?'), 4000);
  } catch(e) {
    showToast('Error de conexión', 4000);
  } finally {
    btn.disabled = false; btn.textContent = originalText;
  }
}

renderStep(0);
updateCounters();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#0f1923">
<title>Mi Plan Diario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1923;
    --surface: #161f2e;
    --surface2: #1d2a3a;
    --border: #253044;
    --accent: #00d4aa;
    --accent2: #ff6b35;
    --accent3: #ffd166;
    --text: #e8f0fe;
    --text2: #7a95b0;
    --salud: #00d4aa;
    --trabajo: #4da6ff;
    --proyecto: #ffd166;
    --casa: #ff6b35;
    --rutina: #a78bfa;
    --personal: #f472b6;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Syne', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* TOP BAR */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(15,25,35,0.95);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .topbar-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 2px;
    text-transform: uppercase;
    font-family: 'Space Mono', monospace;
  }

  .topbar-date {
    font-size: 11px;
    color: var(--text2);
    font-family: 'Space Mono', monospace;
  }

  /* TABS */
  .tabs {
    display: flex;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    position: sticky;
    top: 57px;
    z-index: 99;
  }

  .tab {
    flex: 1;
    padding: 12px 8px;
    text-align: center;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--text2);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
  }

  .tab.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }

  /* VIEWS */
  .view { display: none; padding: 16px; padding-bottom: 32px; }
  .view.active { display: block; }

  /* PROGRESS RING */
  .progress-hero {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 24px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .ring-wrap { position: relative; width: 90px; height: 90px; flex-shrink: 0; }
  .ring-wrap svg { transform: rotate(-90deg); }

  .ring-track { fill: none; stroke: var(--border); stroke-width: 8; }
  .ring-prog {
    fill: none;
    stroke: var(--accent);
    stroke-width: 8;
    stroke-linecap: round;
    stroke-dasharray: 220;
    stroke-dashoffset: 220;
    transition: stroke-dashoffset 0.6s cubic-bezier(.4,0,.2,1);
  }

  .ring-label {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .ring-pct {
    font-family: 'Space Mono', monospace;
    font-size: 20px;
    font-weight: 700;
    color: var(--accent);
    line-height: 1;
  }

  .ring-sub { font-size: 9px; color: var(--text2); letter-spacing: 1px; margin-top: 2px; }

  .progress-info { flex: 1; }
  .progress-info h2 { font-size: 18px; font-weight: 800; margin-bottom: 4px; }
  .progress-info p { font-size: 12px; color: var(--text2); line-height: 1.5; }

  .mini-stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 20px;
  }

  .mini-stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
  }

  .mini-stat-val {
    font-family: 'Space Mono', monospace;
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 2px;
  }

  .mini-stat-label { font-size: 11px; color: var(--text2); }

  /* SCHEDULE BLOCKS */
  .section-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text2);
    margin: 20px 0 10px;
    padding-left: 4px;
    font-family: 'Space Mono', monospace;
  }

  .block {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    margin-bottom: 10px;
    overflow: hidden;
    transition: border-color 0.2s;
  }

  .block.done { opacity: 0.6; }
  .block.done .block-header { text-decoration: line-through; }

  .block-main {
    display: flex;
    align-items: center;
    padding: 14px 14px 14px 16px;
    gap: 12px;
    cursor: pointer;
    position: relative;
  }

  .block-accent-bar {
    position: absolute;
    left: 0;
    top: 8px;
    bottom: 8px;
    width: 3px;
    border-radius: 0 3px 3px 0;
  }

  .block-check {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 2px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.2s;
    cursor: pointer;
  }

  .block-check.checked {
    background: var(--accent);
    border-color: var(--accent);
  }

  .block-check svg { opacity: 0; transition: opacity 0.2s; }
  .block-check.checked svg { opacity: 1; }

  .block-content { flex: 1; min-width: 0; }

  .block-time {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--text2);
    margin-bottom: 3px;
  }

  .block-header {
    font-size: 14px;
    font-weight: 600;
    line-height: 1.3;
  }

  .block-emoji { font-size: 16px; flex-shrink: 0; }

  .block-tag {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 3px 8px;
    border-radius: 20px;
    font-family: 'Space Mono', monospace;
  }

  .block-expand-btn {
    font-size: 11px;
    color: var(--text2);
    flex-shrink: 0;
    transition: transform 0.2s;
  }

  .block-expand-btn.open { transform: rotate(180deg); }

  /* Note area */
  .block-note-area {
    display: none;
    padding: 0 14px 14px 16px;
    border-top: 1px solid var(--border);
    margin-top: 2px;
  }

  .block-note-area.open { display: block; }

  .block-note-area textarea {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: 'Syne', sans-serif;
    font-size: 13px;
    padding: 10px 12px;
    resize: none;
    outline: none;
    line-height: 1.5;
    margin-top: 10px;
    transition: border-color 0.2s;
  }

  .block-note-area textarea:focus { border-color: var(--accent); }
  .block-note-area textarea::placeholder { color: var(--text2); }

  .note-label {
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--text2);
    margin-top: 10px;
    font-family: 'Space Mono', monospace;
  }

  .note-save-btn {
    display: inline-flex;
    margin-top: 8px;
    background: var(--accent);
    color: #0f1923;
    border: none;
    border-radius: 8px;
    padding: 7px 16px;
    font-size: 12px;
    font-weight: 700;
    font-family: 'Syne', sans-serif;
    cursor: pointer;
    letter-spacing: 0.5px;
  }

  /* HISTORY VIEW */
  .history-day {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    margin-bottom: 12px;
    overflow: hidden;
  }

  .history-day-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    cursor: pointer;
  }

  .history-day-date {
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    font-weight: 700;
    color: var(--accent);
  }

  .history-day-pct {
    font-family: 'Space Mono', monospace;
    font-size: 20px;
    font-weight: 700;
  }

  .history-day-bar {
    height: 4px;
    background: var(--border);
    margin: 0 16px 14px;
    border-radius: 2px;
    overflow: hidden;
  }

  .history-day-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 2px;
    transition: width 0.6s;
  }

  .history-detail {
    display: none;
    padding: 0 16px 14px;
    border-top: 1px solid var(--border);
  }

  .history-detail.open { display: block; }

  .history-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }

  .history-item:last-child { border-bottom: none; }

  .history-item-check {
    font-size: 14px;
    margin-top: 1px;
    flex-shrink: 0;
  }

  .history-item-text { flex: 1; line-height: 1.4; }
  .history-item-note { font-size: 11px; color: var(--text2); margin-top: 4px; font-style: italic; }

  /* EMPTY STATE */
  .empty {
    text-align: center;
    padding: 48px 24px;
    color: var(--text2);
  }

  .empty-icon { font-size: 48px; margin-bottom: 12px; }
  .empty p { font-size: 14px; line-height: 1.6; }

  /* WEIGHT INPUT */
  .weight-banner {
    background: linear-gradient(135deg, var(--surface) 0%, #1a2d1a 100%);
    border: 1px solid #2d4a2d;
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .weight-icon { font-size: 28px; }

  .weight-form { flex: 1; }
  .weight-form label { font-size: 11px; color: var(--salud); letter-spacing: 1px; text-transform: uppercase; font-family: 'Space Mono', monospace; }

  .weight-row { display: flex; gap: 8px; margin-top: 6px; }

  .weight-input {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'Space Mono', monospace;
    font-size: 16px;
    padding: 7px 12px;
    width: 90px;
    outline: none;
  }

  .weight-input:focus { border-color: var(--salud); }

  .weight-btn {
    background: var(--salud);
    color: #0f1923;
    border: none;
    border-radius: 8px;
    padding: 7px 14px;
    font-weight: 700;
    font-family: 'Syne', sans-serif;
    font-size: 12px;
    cursor: pointer;
  }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--accent);
    color: #0f1923;
    padding: 10px 20px;
    border-radius: 20px;
    font-weight: 700;
    font-size: 13px;
    z-index: 999;
    transition: transform 0.3s cubic-bezier(.4,0,.2,1);
    white-space: nowrap;
  }

  .toast.show { transform: translateX(-50%) translateY(0); }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-title">⚡ Mi Plan</div>
  <div class="topbar-date" id="topbarDate"></div>
</div>

<div class="tabs">
  <div class="tab active" onclick="switchTab('hoy')">HOY</div>
  <div class="tab" onclick="switchTab('historial')">HISTORIAL</div>
</div>

<div id="view-hoy" class="view active"></div>
<div id="view-historial" class="view"></div>

<div class="toast" id="toast"></div>

<script>
// ═══════════════════════════════════════════
// DATA
// ═══════════════════════════════════════════
const SCHEDULE = [
  { id: 'a1', time: '5:00 – 5:20', text: 'Despertar + hidratación + no revisar el teléfono', emoji: '☀️', cat: 'rutina' },
  { id: 'a2', time: '5:20 – 6:00', text: 'Ejercicio (caminata, bicicleta o rutina en casa)', emoji: '🏃', cat: 'salud' },
  { id: 'a3', time: '6:00 – 6:20', text: 'Ducha + arreglo personal', emoji: '🚿', cat: 'rutina' },
  { id: 'a4', time: '6:20 – 7:00', text: 'Desayuno + dar comida a gallinas y peces', emoji: '🐔', cat: 'rutina' },
  { id: 'a5', time: '7:00 – 7:15', text: 'Revisión rápida del día (tareas de clientes)', emoji: '📋', cat: 'trabajo' },
  { id: 'b1', time: '7:15 – 9:00', text: 'Trabajo Freelance — mantenimiento de sitios', emoji: '💻', cat: 'trabajo' },
  { id: 'b2', time: '9:00 – 9:15', text: 'Pausa activa: caminar o estiramiento', emoji: '🧘', cat: 'salud' },
  { id: 'b3', time: '9:15 – 11:30', text: 'Proyecto Propio — portal vecinos/comunidades', emoji: '🚀', cat: 'proyecto' },
  { id: 'c1', time: '11:30 – 12:30', text: 'Cocinar almuerzo + comer sin pantallas', emoji: '🍽️', cat: 'rutina' },
  { id: 'c2', time: '12:30 – 13:15', text: 'Limpieza diaria (barrer, trapear, arreglar cama)', emoji: '🧹', cat: 'casa' },
  { id: 'c3', time: '13:15 – 15:00', text: 'Trabajo Freelance — cambios de clientes y mensajes', emoji: '💻', cat: 'trabajo' },
  { id: 'c4', time: '15:00 – 16:00', text: 'Tarea pendiente del hogar (ver rotación semanal)', emoji: '🔧', cat: 'casa' },
  { id: 'd1', time: '16:00 – 17:30', text: 'Proyecto Propio — segunda sesión de desarrollo', emoji: '🚀', cat: 'proyecto' },
  { id: 'd2', time: '17:30 – 18:15', text: 'Ejercicio 2 o paseo / bicicleta', emoji: '🚴', cat: 'salud' },
  { id: 'd3', time: '18:15 – 19:00', text: 'Cena + descanso sin redes sociales', emoji: '🌙', cat: 'rutina' },
  { id: 'd4', time: '19:00 – 20:30', text: 'Tiempo libre / entretenimiento intencional', emoji: '📖', cat: 'personal' },
  { id: 'd5', time: '20:30 – 21:00', text: 'Preparar el día siguiente + revisión del día', emoji: '✅', cat: 'rutina' },
  { id: 'd6', time: '21:00', text: 'Dormir', emoji: '😴', cat: 'rutina' },
];

const CAT_COLORS = {
  salud:    '#00d4aa',
  trabajo:  '#4da6ff',
  proyecto: '#ffd166',
  casa:     '#ff6b35',
  rutina:   '#a78bfa',
  personal: '#f472b6',
};

const CAT_LABELS = {
  salud: 'Salud', trabajo: 'Trabajo', proyecto: 'Proyecto',
  casa: 'Hogar', rutina: 'Rutina', personal: 'Personal',
};

const SECTIONS = [
  { label: '🌅 Mañana', ids: ['a1','a2','a3','a4','a5'] },
  { label: '🔥 Bloque Productivo', ids: ['b1','b2','b3'] },
  { label: '☀️ Mediodía', ids: ['c1','c2','c3','c4'] },
  { label: '🌆 Tarde – Noche', ids: ['d1','d2','d3','d4','d5','d6'] },
];

// ═══════════════════════════════════════════
// STATE & STORAGE
// ═══════════════════════════════════════════
function todayKey() {
  const d = new Date();
  return `day_${d.getFullYear()}_${d.getMonth()+1}_${d.getDate()}`;
}

function loadDay(key) {
  try { return JSON.parse(localStorage.getItem(key)) || {}; } catch { return {}; }
}

function saveDay(key, data) {
  localStorage.setItem(key, JSON.stringify(data));
}

function getAllDayKeys() {
  const keys = [];
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k && k.startsWith('day_')) keys.push(k);
  }
  return keys.sort().reverse();
}

function keyToDate(key) {
  const [, y, m, d] = key.split('_');
  const date = new Date(+y, +m-1, +d);
  return date.toLocaleDateString('es-ES', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
}

// ═══════════════════════════════════════════
// TODAY VIEW
// ═══════════════════════════════════════════
let openNotes = {};
let historyOpen = {};

function renderToday() {
  const key = todayKey();
  const data = loadDay(key);
  const total = SCHEDULE.length;
  const done = SCHEDULE.filter(b => data[b.id]?.done).length;
  const pct = Math.round((done / total) * 100);
  const offset = 220 - (220 * pct / 100);

  const todayStr = new Date().toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' });
  document.getElementById('topbarDate').textContent = todayStr;

  const weight = data._weight;
  const weightDiff = getWeightDiff(data._weight);

  let html = `
    <div class="progress-hero">
      <div class="ring-wrap">
        <svg width="90" height="90" viewBox="0 0 90 90">
          <circle class="ring-track" cx="45" cy="45" r="35"/>
          <circle class="ring-prog" cx="45" cy="45" r="35" id="ringProg" style="stroke-dashoffset:${offset}"/>
        </svg>
        <div class="ring-label">
          <div class="ring-pct">${pct}%</div>
          <div class="ring-sub">HOY</div>
        </div>
      </div>
      <div class="progress-info">
        <h2>${getMotivation(pct)}</h2>
        <p>${done} de ${total} bloques completados.<br>¡Sigue el ritmo!</p>
      </div>
    </div>

    <div class="mini-stats">
      <div class="mini-stat">
        <div class="mini-stat-val" style="color:var(--accent)">${done}</div>
        <div class="mini-stat-label">Bloques hechos</div>
      </div>
      <div class="mini-stat">
        <div class="mini-stat-val" style="color:var(--accent2)">${total - done}</div>
        <div class="mini-stat-label">Bloques restantes</div>
      </div>
    </div>

    <div class="weight-banner">
      <div class="weight-icon">⚖️</div>
      <div class="weight-form">
        <label>Peso de hoy (kg)</label>
        <div class="weight-row">
          <input class="weight-input" type="number" id="weightInput" step="0.1" min="40" max="200"
            placeholder="ej: 104.5" value="${weight || ''}">
          <button class="weight-btn" onclick="saveWeight()">Guardar</button>
        </div>
        ${weightDiff !== null ? `<div style="font-size:11px;margin-top:6px;color:var(--salud)">${weightDiff}</div>` : ''}
      </div>
    </div>
  `;

  SECTIONS.forEach(sec => {
    const items = SCHEDULE.filter(b => sec.ids.includes(b.id));
    html += `<div class="section-label">${sec.label}</div>`;
    items.forEach(b => {
      const bd = data[b.id] || {};
      const checked = bd.done ? 'checked' : '';
      const noteOpen = openNotes[b.id] ? 'open' : '';
      const expandOpen = openNotes[b.id] ? 'open' : '';
      const noteVal = bd.note || '';
      const color = CAT_COLORS[b.cat];
      const label = CAT_LABELS[b.cat];

      html += `
        <div class="block${bd.done ? ' done' : ''}" id="block_${b.id}">
          <div class="block-main" onclick="toggleNote('${b.id}')">
            <div class="block-accent-bar" style="background:${color}"></div>
            <div class="block-check ${checked}" onclick="toggleCheck(event,'${b.id}')">
              <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
                <path d="M2 6l3 3 5-5" stroke="#0f1923" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
            <div class="block-content">
              <div class="block-time">${b.time}</div>
              <div class="block-header">${b.text}</div>
            </div>
            <div style="display:flex;flex-direction:column;align-items:flex-end;gap:5px">
              <span class="block-tag" style="background:${color}22;color:${color}">${label}</span>
              <span class="block-expand-btn ${expandOpen}">▼</span>
            </div>
          </div>
          <div class="block-note-area ${noteOpen}" id="note_${b.id}">
            <div class="note-label">📝 Nota del bloque</div>
            <textarea rows="3" placeholder="¿Qué lograste? ¿Algún pendiente?" id="ta_${b.id}">${noteVal}</textarea>
            <br><button class="note-save-btn" onclick="saveNote('${b.id}')">Guardar nota</button>
          </div>
        </div>
      `;
    });
  });

  document.getElementById('view-hoy').innerHTML = html;
}

function getMotivation(pct) {
  if (pct === 0) return '¡Empecemos!';
  if (pct < 25) return '¡Buen arranque!';
  if (pct < 50) return '¡Vas bien!';
  if (pct < 75) return '¡A más de la mitad!';
  if (pct < 100) return '¡Casi lo logras!';
  return '¡Día completado! 🎉';
}

function getWeightDiff(current) {
  if (!current) return null;
  const INITIAL = 105;
  const diff = (current - INITIAL).toFixed(1);
  if (diff < 0) return `📉 Has bajado ${Math.abs(diff)} kg desde el inicio (meta: bajar de 105 kg)`;
  if (diff === '0.0') return '📊 Mismo peso que al inicio. ¡Sigue adelante!';
  return `📈 ${diff} kg sobre el inicio. ¡El ejercicio está comenzando a actuar!`;
}

function toggleCheck(e, id) {
  e.stopPropagation();
  const key = todayKey();
  const data = loadDay(key);
  data[id] = data[id] || {};
  data[id].done = !data[id].done;
  saveDay(key, data);
  renderToday();
  showToast(data[id].done ? '✅ Bloque completado' : '↩️ Marcado como pendiente');
}

function toggleNote(id) {
  openNotes[id] = !openNotes[id];
  renderToday();
}

function saveNote(id) {
  const key = todayKey();
  const data = loadDay(key);
  data[id] = data[id] || {};
  data[id].note = document.getElementById('ta_' + id).value;
  saveDay(key, data);
  showToast('📝 Nota guardada');
}

function saveWeight() {
  const val = parseFloat(document.getElementById('weightInput').value);
  if (!val || val < 40 || val > 200) { showToast('⚠️ Ingresa un peso válido'); return; }
  const key = todayKey();
  const data = loadDay(key);
  data._weight = val;
  saveDay(key, data);
  showToast('⚖️ Peso registrado: ' + val + ' kg');
  renderToday();
}

// ═══════════════════════════════════════════
// HISTORY VIEW
// ═══════════════════════════════════════════
function renderHistory() {
  const keys = getAllDayKeys();
  const view = document.getElementById('view-historial');

  if (keys.length === 0) {
    view.innerHTML = `
      <div class="empty">
        <div class="empty-icon">📭</div>
        <p>Aún no hay historial.<br>Completa tu primer día<br>y aquí verás tu progreso.</p>
      </div>`;
    return;
  }

  let html = '';
  keys.forEach(key => {
    const data = loadDay(key);
    const total = SCHEDULE.length;
    const done = SCHEDULE.filter(b => data[b.id]?.done).length;
    const pct = Math.round((done / total) * 100);
    const dateStr = keyToDate(key);
    const isOpen = historyOpen[key];
    const pctColor = pct >= 70 ? 'var(--accent)' : pct >= 40 ? 'var(--accent3)' : 'var(--accent2)';
    const weight = data._weight ? `⚖️ ${data._weight} kg` : '';

    let detailHtml = '';
    SCHEDULE.forEach(b => {
      const bd = data[b.id] || {};
      const icon = bd.done ? '✅' : '⬜';
      detailHtml += `
        <div class="history-item">
          <div class="history-item-check">${icon}</div>
          <div class="history-item-text">
            <div>${b.emoji} ${b.text}</div>
            ${bd.note ? `<div class="history-item-note">"${bd.note}"</div>` : ''}
          </div>
        </div>`;
    });

    html += `
      <div class="history-day">
        <div class="history-day-header" onclick="toggleHistory('${key}')">
          <div>
            <div class="history-day-date">${dateStr}</div>
            ${weight ? `<div style="font-size:11px;color:var(--text2);margin-top:3px">${weight}</div>` : ''}
          </div>
          <div class="history-day-pct" style="color:${pctColor}">${pct}%</div>
        </div>
        <div class="history-day-bar">
          <div class="history-day-bar-fill" style="width:${pct}%"></div>
        </div>
        <div class="history-detail ${isOpen ? 'open' : ''}" id="hist_${key}">
          ${detailHtml}
        </div>
      </div>`;
  });

  view.innerHTML = html;
}

function toggleHistory(key) {
  historyOpen[key] = !historyOpen[key];
  renderHistory();
}

// ═══════════════════════════════════════════
// TABS & TOAST
// ═══════════════════════════════════════════
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.classList.toggle('active', ['hoy','historial'][i] === tab);
  });
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-' + tab).classList.add('active');
  if (tab === 'historial') renderHistory();
}

let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

// ═══════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════
renderToday();
</script>
</body>
</html>

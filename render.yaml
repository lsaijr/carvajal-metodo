services:
  - type: web
    name: carvajal-metodo
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --timeout 300 --bind 0.0.0.0:$PORT
    envVars:
      - key: CLAUDE_KEY
        sync: false
      - key: RESEND_KEY
        sync: false
      - key: MAIL_TO
        value: isai.josue@gmail.com
      - key: MAIL_FROM
        value: envios@centrocarvajal.com
      - key: BASE_URL
        value: https://metodo.centrocarvajal.com
